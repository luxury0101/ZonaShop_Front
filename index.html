<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Catálogo de productos de ZonaShop" />

    <title>ZonaShop</title>
  </head>

  <body>
    <header class="encabezado">
      <a class="marca" href="/"> ZonaShop </a>

      <div id="zona-invitado">
        <button id="boton-abrir-login" type="button">Administración</button>
      </div>

      <div id="zona-administrador" hidden>
        <span>
          Administrador:
          <strong id="nombre-usuario"></strong>
        </span>

        <button id="boton-cerrar-sesion" type="button">Cerrar sesión</button>
      </div>

      <button class="boton-carrito" type="button">
        Carrito
        <span id="cantidad-carrito">0</span>
      </button>
    </header>

    <main>
      <section class="presentacion">
        <div class="presentacion__contenido">
          <p class="presentacion__etiqueta">Catálogo en línea</p>

          <h1>Encuentra tu próximo favorito</h1>

          <p>
            Consulta nuestros productos, precios y disponibilidad actualizada.
          </p>
        </div>
      </section>

      <section class="catalogo" aria-labelledby="titulo-catalogo">
        <div class="catalogo__encabezado">
          <div>
            <p class="seccion-etiqueta">Explorar</p>

            <h2 id="titulo-catalogo">Productos</h2>
          </div>

          <form id="formulario-filtros" class="filtros">
            <label>
              Buscar producto

              <input id="busqueda" type="search" placeholder="Ej. camiseta" />
            </label>

            <label>
              Categoría

              <select id="categoria">
                <option value="">Todas las categorías</option>
              </select>
            </label>

            <button type="submit">Buscar</button>
          </form>
        </div>

        <p id="estado" class="estado" role="status">Cargando catálogo...</p>

        <div id="productos" class="productos" aria-live="polite"></div>
      </section>
    </main>

    <!-- Modal de acceso administrativo -->
    <dialog id="modal-login">
      <form id="formulario-login">
        <h2>Acceso administrativo</h2>

        <label for="username"> Usuario </label>

        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
        />

        <label for="password"> Contraseña </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <p id="mensaje-login" aria-live="polite"></p>

        <div>
          <button type="submit">Iniciar sesión</button>

          <button id="boton-cancelar-login" type="button">Cancelar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
